name: Deploy

# Staging deploys automatically from the default branches. Production is deployed
# on demand via "Run workflow" (workflow_dispatch) with environment=production.
# Protect the GitHub "production" environment with required reviewers to gate it.
#
# Required repository/environment secrets:
#   CLOUDFLARE_API_TOKEN   API token with: Workers Scripts:Edit, D1:Edit,
#                          Workers AI:Read, Account Settings:Read (for the account)
#   CLOUDFLARE_ACCOUNT_ID  The Cloudflare account ID
# JWT_SECRET is NOT managed here: set it once per environment with
#   wrangler secret put JWT_SECRET --env <staging|production>

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint OpenAPI contract
        run: npm run lint:openapi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --env "$TARGET_ENV"

      - name: Deploy Worker
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --env "$TARGET_ENV" 2>&1 | tee deploy.log

      - name: Health check
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)
          if [ -z "$URL" ]; then
            echo "No workers.dev URL found in deploy output."
            exit 1
          fi
          echo "Checking $URL/v1/health"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$URL/v1/health"; then echo; echo "Healthy."; exit 0; fi
            sleep 10
          done
          echo "Health check failed after 6 attempts."
          exit 1
