<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Course Catalog API</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      body {
        margin: 0;
        padding: 3rem 1.5rem;
        background: #0f172a;
        color: #e2e8f0;
      }

      main {
        max-width: 44rem;
        margin: 0 auto;
      }

      h1 {
        margin-bottom: 0.25rem;
        font-size: 2rem;
      }

      p {
        color: #94a3b8;
      }

      code {
        padding: 0.15rem 0.4rem;
        border-radius: 0.25rem;
        background: #1e293b;
        color: #f8fafc;
      }

      a {
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Course Catalog API</h1>
      <p>Cloudflare Workers service for courses, instructors, prerequisites, and webhooks.</p>
      <p>Health check: <code>GET /v1/health</code></p>
      <p>The API contract lives in <code>openapi.yaml</code> at the repository root.</p>
    </main>
  </body>
</html>
